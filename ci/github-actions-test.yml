name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install herdr 0.9.5
        run: |
          case "${{ runner.os }}" in
            Linux) prefix=herdr-linux ;;
            macOS) prefix=herdr-macos ;;
            *) echo "unsupported runner" >&2; exit 1 ;;
          esac
          case "${{ runner.arch }}" in
            X64) suffix=x86_64 ;;
            ARM64) suffix=aarch64 ;;
            *) echo "unsupported arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v0.9.5/${prefix}-${suffix}"
          chmod +x "$RUNNER_TEMP/herdr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: unit tests
        run: python -m unittest tests.test_grace tests.test_install tests.test_detection tests.test_doctor
