id = "kiro"
version = "2026.09.19.1"
min_engine_version = 2
updated_at = "2026-09-19T00:00:00Z"
aliases = ["kiro-cli"]

[[rules]]
id = "live_prompt_idle"
state = "idle"
priority = 1100
region = "bottom_non_empty_lines(4)"
# A one-frame idle prompt under a workflow banner was published immediately
# because visible_idle skips herdr's pending-idle hold. Leave the flag off so
# that frame is held long enough for the banner rule to win.
visible_idle = false
line_regex = ['(?i)^\s*[>›]\s*ask a question or describe a task(?:\s+(?:enter|↵))?\s*$']

[[rules]]
id = "tool_approval"
state = "blocked"
priority = 1410
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { all = [
    { regex = ['(?is)(?:^|\n)\s*esc\s+to\s+close\b(?:[^\n]*\bto\s+navigate\b[^\n]*|.*\bto\s+navigate\b.*\bto\s+select\b.*\btab\s+to\s+edit|[^\n]*\benter\s+to\s+see\s+more\s+options)\s*\z'] },
    { any = [
      { line_regex = [
        '(?i)^\s*[>❯]\s*(?:allow|always allow|deny|always deny)\s*$',
        '(?i)^\s*(?:[>❯]\s*)?allow\s*$',
        '(?i)^\s*(?:[>❯]\s*)?always allow\s*$',
        '(?i)^\s*(?:[>❯]\s*)?deny\s*$',
        '(?i)^\s*(?:[>❯]\s*)?always deny\s*$',
      ] },
      { line_regex = [
        '(?i)^\s*[>❯]\s*(?:yes, single permission|trust, always allow in this session|no \(tab to edit\))\s*$',
        '(?i)^\s*(?:[>❯]\s*)?yes, single permission\s*$',
        '(?i)^\s*(?:[>❯]\s*)?trust, always allow in this session\s*$',
        '(?i)^\s*(?:[>❯]\s*)?no \(tab to edit\)\s*$',
      ] },
      { line_regex = [
        '(?i)^\s*[>❯]\s*(?:trust\b.*|entire tool)\s*$',
        '(?i)^\s*(?:[>❯]\s*)?(?:trust )?entire tool(?:\s+\([^\n]*\))?(?:\s+(?:session|workspace|always))?\s*$',
      ] },
    ] },
  ] },
]

[[rules]]
id = "tool_approval_edit"
state = "blocked"
priority = 1400
region = "whole_recent"
visible_blocker = true
regex = ['(?im)(?:^|\n)[ \t]*[-─]+[ \t]*\n[^\n]*requires\s+approval\s*[·.]\s*modify\s+request[ \t]*\n(?:[ \t]*\n|[^\n]*[^\s─-][^\n]*\n)*?[ \t]*[>›][ \t]*[^\n]*\n(?:[ \t]*\n|[^\n]*[^\s─-][^\n]*\n)*[ \t]*[-─]+[ \t]*\n[ \t]*esc[ \t]+to[ \t]+close[ \t]*\n?\z']

[[rules]]
id = "crew_approval"
state = "blocked"
priority = 1390
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "tool approval",
  "approve all pending",
  "exit (cancel subagents)",
]
# The parenthetical wraps onto the next line in a 40-column pane.
regex = ['(?is)configure\s+individually\s+\(\s*agent\s+mon\s*itor\s*\)']

[[rules]]
id = "question_panel"
state = "blocked"
priority = 1380
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["to navigate", "to submit", "esc to cancel"]

[[rules]]
id = "live_working_footer"
state = "working"
priority = 950
region = "bottom_non_empty_lines(4)"
visible_working = true
contains = ["kiro is working", "type to steer", "ctrl+s to queue"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?i)^[◐◓◑◒/|\\-]\s+kiro:']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 890
region = "osc_progress"
visible_working = true
regex = ['^4;3;?$']


[[rules]]
id = "workflow_banner_working"
state = "working"
priority = 1200
region = "whole_recent"
visible_working = true
# ctrl+g wraps or is clipped when a 61-column banner is drawn in a 54-column pane.
# The line still starts with the arrow and still contains ctrl+x. A model line
# such as "Status: ▶ deploy running" has no ctrl+x, so it does not match.
line_regex = ['(?i)^\s*▶\s+\S+\s+running\b.*\bctrl\+x\b']

[[rules]]
id = "workflow_requires_approval"
state = "blocked"
priority = 1430
region = "bottom_non_empty_lines(24)"
visible_blocker = true
# A 69-column "requires approval" row splits inside the word at 54 columns.
regex = ['(?is)re\s*quires\s+approval']
line_regex = [
  '(?i)(?:^[\s│┃║┌┐└┘├┤┬┴┼─]*?(?:[>❯]\s*)?allow once\s*[█▲▼░▒▓▌│┃║]*\s*$|^.*[└├].*│\s*(?:[>❯]\s*)?allow once\s*[█▲▼░▒▓▌│┃║]*\s*$)',
  '(?i)(?:^[\s│┃║┌┐└┘├┤┬┴┼─]*?(?:[>❯]\s*)?deny once\s*[█▲▼░▒▓▌│┃║]*\s*$|^.*│\s*(?:[>❯]\s*)?deny once\s*[█▲▼░▒▓▌│┃║]*\s*$)',
]

[[rules]]
id = "workflow_chooser_blocked"
state = "blocked"
priority = 1420
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['(?i)^\s*esc\s+to\s+close\b.*\bto\s+navigate\b.*\bto\s+select\b']

[[rules]]
id = "workflow_approval_more_options"
state = "blocked"
priority = 1360
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['(?i)^\s*esc\s+to\s+close\b.*\benter\s+to\s+see\s+more\s+options\b']

[[rules]]
id = "workspace_trust"
state = "blocked"
priority = 1440
region = "bottom_non_empty_lines(48)"
visible_blocker = true
# The title and the two option rows stay intact when the revoke hint or the
# footer wraps. The selected row carries the dialog marker. A workflow banner
# as the last line of the region is not this dialog.
regex = ['''(?is)trust this workspace\?.*?\n[ \t]*[>❯][ \t]*trust, continue[ \t]*\n(?:[ \t]*\n){0,3}[ \t]*don't trust, exit[ \t]*(?:\n|$)''']
not = [{ regex = ['(?is)▶[ \t]+\S+[ \t]+running\b[^\n]*\s*\z'] }]

[[rules]]
id = "workflow_trust_all"
state = "blocked"
priority = 1370
region = "bottom_non_empty_lines(16)"
visible_blocker = true
line_regex = ['(?i)^\s*esc\s+to\s+cancel\b.*\bto\s+navigate\b.*\bto\s+select\b']

[[rules]]
id = "workflow_question_esc_cancel"
state = "blocked"
priority = 1385
region = "bottom_non_empty_lines(12)"
visible_blocker = true
contains = ["esc to cancel", "to navigate", "to submit"]
