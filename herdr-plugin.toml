id = "herdr-kiro"
name = "Kiro workflow state"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Report a Kiro CLI V3 session to the Herdr App with OSC 7501, and keep the Herdr TUI path working."
platforms = ["linux", "macos"]

# GitHub `herdr plugin install` runs build before it registers the plugin.
# `herdr plugin link` does not run build.
[[build]]
command = ["sh", "install.sh"]

# Repairs only when the lifecycle marker says installed. An uninstall stays undone.
[[startup]]
command = ["sh", "startup.sh"]

[[actions]]
id = "install"
title = "Install the Kiro hook and the detection override"
command = ["sh", "install.sh"]

[[actions]]
id = "uninstall"
title = "Remove the Kiro hook and the detection override"
command = ["sh", "uninstall.sh"]

[[actions]]
id = "doctor"
title = "Show herdr, Kiro, and hook status"
command = ["python3", "prototype/herdr_kiro_doctor.py"]
